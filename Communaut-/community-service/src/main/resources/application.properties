spring.application.name=community-service
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=sirmaroc_community;integratedSecurity=true;encrypt=true;trustServerCertificate=true}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:dbo}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=${DB_SCHEMA:dbo}
spring.flyway.baseline-on-migrate=true
spring.flyway.connect-retries=${FLYWAY_CONNECT_RETRIES:3}

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.time-zone=UTC
spring.servlet.multipart.max-file-size=${CHAT_MAX_UPLOAD_SIZE:8MB}
spring.servlet.multipart.max-request-size=${CHAT_MAX_UPLOAD_SIZE:8MB}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_DETAILS:never}
management.health.db.enabled=true

logging.level.ma.sirmaroc=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}

app.chat.default-fetch-limit=${CHAT_DEFAULT_FETCH_LIMIT:60}
app.chat.max-fetch-limit=${CHAT_MAX_FETCH_LIMIT:100}
app.chat.active-participant-window-minutes=${CHAT_ACTIVE_WINDOW_MINUTES:30}
app.chat.upload.directory=${CHAT_UPLOAD_DIR:uploads/chat}
app.chat.upload.public-base-path=${CHAT_UPLOAD_PUBLIC_BASE_PATH:/api/v1/chat/uploads}
app.chat.upload.max-file-size=${CHAT_MAX_UPLOAD_SIZE:8MB}
app.chat.upload.allowed-content-types=${CHAT_UPLOAD_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp,image/avif,image/gif}

app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.security.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.security.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Gateway-Token,X-Authenticated-User,X-Authenticated-Roles}
app.security.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}

app.security.gateway.enabled=${GATEWAY_TRUST_ENABLED:true}
app.security.gateway.shared-secret=${GATEWAY_SHARED_SECRET:change-me-gateway-secret}
app.security.gateway.gateway-header-name=${GATEWAY_HEADER_NAME:X-Gateway-Token}
app.security.gateway.username-header-name=${GATEWAY_USER_HEADER_NAME:X-Authenticated-User}
app.security.gateway.roles-header-name=${GATEWAY_ROLES_HEADER_NAME:X-Authenticated-Roles}
app.security.jwt.issuer=${JWT_ISSUER:UserService.Api}
app.security.jwt.audience=${JWT_AUDIENCE:UserService.Client}
app.security.jwt.secret-key=${JWT_SECRET_KEY:CHANGE_ME_USE_A_STRONG_256_BIT_SECRET_KEY_123456789}
