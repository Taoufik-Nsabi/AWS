services:
  api-gateway:
    build:
      context: ./Gateway
      dockerfile: Dockerfile
    container_name: projects-api-gateway-1
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Redis: redis:6379
      Jwt__Issuer: UserService.Api
      Jwt__Audience: UserService.Client
      Jwt__SecretKey: "ThisIsASecretKeyForJwtAuthDemo123!"
      Services__Auth__BaseUrl: http://auth-service:8080
      Services__Tourism__BaseUrl: http://symfony-web:80
      Services__Python__BaseUrl: http://python-service:8000
      SERPAPI_API_KEY: ${SERPAPI_API_KEY}
      Cors__AllowedOrigins__0: http://localhost:3000
      Cors__AllowedOrigins__1: http://localhost:5173
    depends_on:
      redis:
        condition: service_started
      auth-service:
        condition: service_started
      symfony-web:
        condition: service_started
      python-service:
        condition: service_started
      matches-service:
        condition: service_started
    networks:
      - sirmaroc-net

  front:
    build:
      context: ./sir-maroc-front
      dockerfile: Dockerfile
    container_name: projects-front-1
    restart: unless-stopped
    command: sh -c "npm install --include=dev && node node_modules/vite/bin/vite.js --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./sir-maroc-front:/app
      - front_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_BASE_URL: http://localhost:8080
    stdin_open: true
    tty: true
    depends_on:
      - api-gateway
    networks:
      - sirmaroc-net

  auth-service:
    build:
      context: ./SirMarocUser
      dockerfile: UserService.Api/Dockerfile
    container_name: projects-auth-service-1
    restart: unless-stopped
    env_file:
      - ./SirMarocUser/.env
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=UserServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True
      BACKEND_URL: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      PublicBaseUrl: http://localhost:8082
    volumes:
      - auth_uploads:/app/wwwroot/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
    networks:
      - sirmaroc-net

  redis:
    image: redis:7-alpine
    container_name: projects-redis-1
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - sirmaroc-net

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: projects-sqlserver-1
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong@Passw0rd"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -Q \"SELECT 1\" -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - sirmaroc-net

  sqlserver-init:
    image: mcr.microsoft.com/mssql-tools
    container_name: projects-sqlserver-init-1
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P "YourStrong@Passw0rd" -Q "IF DB_ID('sirmaroc_matchs') IS NULL CREATE DATABASE sirmaroc_matchs;"
    restart: "no"
    networks:
      - sirmaroc-net

  symfony-app:
    build:
      context: ./SirMaroc
      dockerfile: Dockerfile
    container_name: projects-symfony-app-1
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      DATABASE_URL: "sqlsrv://sa:YourStrong%40Passw0rd@sqlserver:1433/symfony_db"
    volumes:
      - ./SirMaroc:/var/www/html
      - symfony_vendor:/var/www/html/vendor
      - symfony_cache:/var/www/html/var/cache
      - symfony_log:/var/www/html/var/log
      - symfony_uploads:/var/www/html/public/uploads
    ports:
      - "9000:9000"
    command: >
      sh -c "mkdir -p /var/www/html/var/cache/prod/vich_uploader /var/www/html/var/log /var/www/html/public/uploads
      && chown -R www-data:www-data /var/www/html/var /var/www/html/public/uploads
      && chmod -R ug+rwX /var/www/html/var /var/www/html/public/uploads
      && php-fpm"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - sirmaroc-net

  symfony-web:
    image: nginx:latest
    container_name: projects-symfony-web-1
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./SirMaroc:/var/www/html
      - ./SirMaroc/docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - symfony-app
    networks:
      - sirmaroc-net

  python-service:
    build:
      context: ./Sirmaroc_python
      dockerfile: Dockerfile
    container_name: projects-python-service-1
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./Sirmaroc_python:/app
    environment:
      PYTHONUNBUFFERED: "1"
    networks:
      - sirmaroc-net

  matches-service:
    build:
      context: ./SirMarocMatch
      dockerfile: Dockerfile
    container_name: projects-matches-service-1
    restart: unless-stopped
    env_file:
      - ./SirMarocMatch/.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=sirmaroc_matchs;encrypt=true;trustServerCertificate=true
      DB_USERNAME: sa
      DB_PASSWORD: YourStrong@Passw0rd
      GATEWAY_TRUST_ENABLED: "true"
      GATEWAY_SHARED_SECRET: change-me-gateway-secret
      GATEWAY_HEADER_NAME: X-Gateway-Token
      GATEWAY_USER_HEADER_NAME: X-Authenticated-User
      GATEWAY_ROLES_HEADER_NAME: X-Authenticated-Roles
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - sirmaroc-net

volumes:
  auth_uploads:
  front_node_modules:
  sqlserver_data:
  symfony_cache:
  symfony_log:
  symfony_uploads:
  symfony_vendor:

networks:
  sirmaroc-net:
    driver: bridge
